upstream dianping_backend { server backend-1:8080 max_fails=2 fail_timeout=10s; server backend-2:8080 max_fails=2 fail_timeout=10s; }
server { listen 80; location ~ ^/(api/|login$|logout$|users|captcha$|images/|packages/|actuator/health$) { proxy_pass http://dianping_backend; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 2s; proxy_read_timeout 10s; proxy_next_upstream error timeout http_502 http_503 http_504; } location / { root /usr/share/nginx/html; try_files $uri /index.html; } }
