services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dianping}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
  backend-1:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dianping
      DB_USERNAME: ${MYSQL_USER:?set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JPA_DDL_AUTO: update
      DEMO_DATA_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  backend-2:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dianping
      DB_USERNAME: ${MYSQL_USER:?set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JPA_DDL_AUTO: validate
    depends_on:
      backend-1:
        condition: service_healthy
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend-1
      - backend-2
