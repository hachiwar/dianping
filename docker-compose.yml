services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dianping
      MYSQL_USER: dianping
      MYSQL_PASSWORD: dianping
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
  backend-1:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dianping
      DB_USERNAME: dianping
      DB_PASSWORD: dianping
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JPA_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  backend-2:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dianping
      DB_USERNAME: dianping
      DB_PASSWORD: dianping
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JPA_DDL_AUTO: validate
    depends_on:
      backend-1:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
